name: release-artifact

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  host-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI (release)
        run: cargo build -p draconic-cli --release
      - name: Stage host-triple artifact
        run: bash scripts/release-artifact.sh --bin target/release/draconic --out dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: draconic-host
          path: dist/draconic-*
