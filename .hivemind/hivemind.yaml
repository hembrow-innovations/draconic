# Draconic dest. Full file. No overlay. Dest copy is the runtime contract.
# Unattended heio-stack loop. Three lanes feed each other in parallel:
#   planner (pump lock) → builder (active slice)
#   → reviewer (released slice)
#   ↻ misses mint ready-for-agent tickets; planner seals the next slice
# Slice status active means builder may match.
# released → reviewing → met | failed.
# Tickets: ready-for-agent vs ready-for-human. Planner mints one ROADMAP.md
# todo when WIP is under cap. Doctor not shipped. cmd is argv. pi --print.
# --approve trusts the folder. Planner is last so builder/reviewer still
# match while work is in flight.
#
# Pipeline: planner → builder → reviewer
#   ↻ planner mints/plans the next ready-for-agent ticket when WIP < 3
history: .heio/logs/hivemind.tsv
folders:
  - path: .heio/tickets
    schema:
      id: string
      title: string
      kind: string
      status: string
      labels: string
      tags: string
      sprint: string
      slice: string
      created_at: string
      updated_at: string
      claimed-by: string
      caused-by: string
      failed: string
      intent: string
    required: [id, status]
  - path: .heio/planning
    schema:
      id: string
      title: string
      kind: string
      status: string
      sprint: string
      tags: string
      created_at: string
      updated_at: string
      claimed-by: string
      blocked-by: string
      mode: string
      sitting-kind: string
    required: [id, kind, status]
  - path: .heio/archive
    schema:
      id: string
      title: string
      kind: string
      status: string
      sprint: string
      tags: string
      created_at: string
      updated_at: string
      claimed-by: string
      blocked-by: string
      caused-by: string
      failed: string
      intent: string
      labels: string
      slice: string
      mode: string
      sitting-kind: string
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
actors:
  pi:
    cmd:
      - pi
      - --print
      - --no-session
      - --approve
      - --exclude-tools
      - ask_user_question
      - --agent
      - "{{agent}}"
      - "--"
      - "@{{prompt}}"
lanes:
  # Builder: one incomplete task on an active slice. Gauntlet-loop (tdd +
  # critic CHECK, max 3 rounds, plateau → blocked + ticket). Commits the
  # work package (never stages .heio/). Leaves the slice active if more
  # tasks remain; sets released when the pool is done so Reviewer matches.
  # ttl reverts a hung claim so the lane cannot stick on a dead cargo run.
  builder:
    type: single
    concurrency: 1
    actor: pi
    agent: builder
    prompt: prompts/hivemind-builder.md
    trigger:
      kind: slice
      status: active
    claim-status: active
    backoff: 15s
    ttl: 45m
  # Reviewer: one released slice. Claims as reviewing, re-runs oracles.
  # ALL MET → slice met and ROADMAP done. Miss → slice failed and mints a
  # ready-for-agent ticket with caused-by (mint-status) so Planner feeds a
  # fix slice. No product code. Listed beside builder so both match in one
  # tick while Planner is last.
  reviewer:
    type: single
    concurrency: 1
    actor: pi
    agent: reviewer
    prompt: prompts/hivemind-reviewer.md
    trigger:
      kind: slice
      status: released
    claim-status: reviewing
    mint-status: ready-for-agent
    backoff: 15s
  # Planner: idle pump lock → one unit (plan a ready-for-agent ticket into
  # an active slice with task-pool, or mint one ROADMAP todo under WIP cap).
  # Occupied at cap → mint nothing and leave pump held. Empty board + idle
  # → mint. exhausted → watch can exit. Listed last so builder/reviewer win
  # while work is in flight. Backoff throttles the idle mint/plan loop.
  planner:
    type: single
    concurrency: 1
    actor: pi
    agent: planner
    prompt: prompts/hivemind-planner.md
    trigger:
      kind: pump
      status: idle
    claim-status: active
    mint-status: ready-for-agent
    backoff: 15s
