[workspace]
resolver = "2"
members = [
    "crates/draconic-diagnostics",
    "crates/draconic-ast",
    "crates/draconic-lexer",
    "crates/draconic-parser",
    "crates/draconic-linker",
    "crates/draconic-check",
    "crates/draconic-ir",
    "crates/draconic-frontend",
    "crates/draconic-backend-js",
    "crates/draconic-backend-llvm",
    "crates/draconic-runtime",
    "crates/draconic-embed",
    "crates/draconic-lsp",
    "crates/draconic-pkg",
    "crates/draconic-cli",
    "tests/integration",
    "tests/conformance",
    "tests/test262",
]
# Standalone fuzz packages (cargo-fuzz / designed harness); not built by workspace.
exclude = [
    "crates/draconic-parser/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hembrow-innovations/draconic"

[workspace.dependencies]
draconic-diagnostics = { path = "crates/draconic-diagnostics" }
draconic-ast = { path = "crates/draconic-ast" }
draconic-lexer = { path = "crates/draconic-lexer" }
draconic-parser = { path = "crates/draconic-parser" }
draconic-linker = { path = "crates/draconic-linker" }
draconic-check = { path = "crates/draconic-check" }
draconic-ir = { path = "crates/draconic-ir" }
draconic-frontend = { path = "crates/draconic-frontend" }
draconic-lsp = { path = "crates/draconic-lsp" }
draconic-backend-js = { path = "crates/draconic-backend-js" }
draconic-backend-llvm = { path = "crates/draconic-backend-llvm" }
draconic-runtime = { path = "crates/draconic-runtime" }
draconic-embed = { path = "crates/draconic-embed" }
draconic-pkg = { path = "crates/draconic-pkg" }
draconic-conformance = { path = "tests/conformance" }
thiserror = "2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
