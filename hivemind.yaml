# Draconic dest. Full file. No overlay. Dest copy is the runtime contract.
# Unattended heio-stack loop. Slice status ready means schedulable (replaces
# frozen). Then active / released / reviewing / met / failed. Tickets:
# ready-for-agent vs ready-for-human. Pump mints one ROADMAP.md todo as a
# ticket. Doctor not shipped. cmd is pi --print so watch does not open a TUI.
# Pump is last so plan/tasker/build/review win while work is in flight.
concurrency: 5
folders:
  - path: .heio/tickets
    schema: ticket
    required: [id, status]
  - path: .heio/planning
    schema: planning
    required: [id, kind, status]
  - path: .heio/archive
    schema: archive
    required: [id]
  - path: .heio/quarantine
    schema: quarantine
    required: [origin-location, quarantined-at, fault]
lanes:
  # Plan: one ready-for-agent ticket → one sealed slice (oracles, status ready).
  # Claims the ticket as active, writes the slice under .heio/planning, then
  # marks the ticket promoted. No product code and no task-pool files.
  - lane: plan
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-planner
    prompt: prompts/hivemind-plan.md
    trigger:
      kind: ticket
      status: ready-for-agent
    claim-status: active
    backoff: 15s
  # Tasker: one ready slice → task-pool files plus [[id]] links on the slice.
  # Claims the slice as active. One sitting per task. No product code; does
  # not edit EXPECT, intent, roadmap, or sprint shape.
  - lane: tasker
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-tasker
    prompt: prompts/hivemind-tasker.md
    trigger:
      kind: slice
      status: ready
    claim-status: active
    backoff: 15s
  # Build: one incomplete task on an active slice. Runs draconic-loop + TDD,
  # commits the work package (never stages .heio/). Leaves the slice active
  # if more tasks remain; sets released when the pool is done so Review matches.
  - lane: build
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-builder
    prompt: prompts/hivemind-build.md
    trigger:
      kind: slice
      status: active
    claim-status: active
    backoff: 15s
  # Review: one released slice. Claims as reviewing, re-runs oracles.
  # ALL MET → slice met and ROADMAP done. Miss → slice failed and mints a
  # ready-for-agent ticket with caused-by (mint-status). No product code.
  - lane: review
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-verifier
    prompt: prompts/hivemind-review.md
    trigger:
      kind: slice
      status: released
    claim-status: reviewing
    mint-status: ready-for-agent
    backoff: 15s
  # Pump: idle pump + empty in-flight queue → one ROADMAP todo ticket at
  # ready-for-agent (mint-status), then pump returns to idle. Occupied board
  # → mint nothing, stay idle. No todos left → exhausted so watch can exit.
  # Listed last so plan/tasker/build/review win while work is in flight.
  - lane: pump
    cmd: "pi --print --no-session --approve --agent {{agent}} -- @{{prompt}}"
    agent: heio-triage
    prompt: prompts/hivemind-pump.md
    trigger:
      kind: pump
      status: idle
    claim-status: active
    mint-status: ready-for-agent
    backoff: 15s
